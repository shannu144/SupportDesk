services:
  db:
    image: postgres:16-alpine
    container_name: supportdesk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-supportdesk}
      POSTGRES_USER: ${DB_USER:-supportuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supportpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-supportuser} -d ${DB_NAME:-supportdesk}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportdesk_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY:-insecure-docker-secret-key-change-in-prod}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-supportdesk}
      - DB_USER=${DB_USER:-supportuser}
      - DB_PASSWORD=${DB_PASSWORD:-supportpassword}
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportdesk_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:
