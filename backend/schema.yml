openapi: 3.0.3
info:
  title: SupportDesk REST API
  version: 1.0.0
  description: Production-ready customer support ticket management system API
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/agents/:
    get:
      operationId: v1_agents_list
      description: |-
        List active agents and admins for ticket assignment.
        Restricted to Agents and Admins.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: |-
        Retrieve or update the currently authenticated user's profile.
        Changing email or role is strictly forbidden through this endpoint.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_auth_me_update
      description: |-
        Retrieve or update the currently authenticated user's profile.
        Changing email or role is strictly forbidden through this endpoint.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdate'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      description: |-
        Retrieve or update the currently authenticated user's profile.
        Changing email or role is strictly forbidden through this endpoint.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdate'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      description: |-
        CRUD for ticket categories.
        List/Retrieve: All authenticated users.
        Create/Update/Delete: Admins only.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTicketCategoryList'
          description: ''
    post:
      operationId: v1_categories_create
      description: |-
        CRUD for ticket categories.
        List/Retrieve: All authenticated users.
        Create/Update/Delete: Admins only.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TicketCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TicketCategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCategory'
          description: ''
  /api/v1/categories/{id}/:
    get:
      operationId: v1_categories_retrieve
      description: |-
        CRUD for ticket categories.
        List/Retrieve: All authenticated users.
        Create/Update/Delete: Admins only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ticket category.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCategory'
          description: ''
    put:
      operationId: v1_categories_update
      description: |-
        CRUD for ticket categories.
        List/Retrieve: All authenticated users.
        Create/Update/Delete: Admins only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ticket category.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TicketCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TicketCategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCategory'
          description: ''
    patch:
      operationId: v1_categories_partial_update
      description: |-
        CRUD for ticket categories.
        List/Retrieve: All authenticated users.
        Create/Update/Delete: Admins only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ticket category.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTicketCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTicketCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTicketCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCategory'
          description: ''
    delete:
      operationId: v1_categories_destroy
      description: |-
        CRUD for ticket categories.
        List/Retrieve: All authenticated users.
        Create/Update/Delete: Admins only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ticket category.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/dashboard/summary/:
    get:
      operationId: v1_dashboard_summary_retrieve
      description: Returns actual calculated metrics based on the requester's role.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/dashboard/trends/:
    get:
      operationId: v1_dashboard_trends_retrieve
      description: Returns weekly ticket trends and agent workload for charts.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/tickets/:
    get:
      operationId: v1_tickets_list
      description: Complete CRUD, search, filter, sorting, assignment, and messaging
        for tickets.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSupportTicketListList'
          description: ''
    post:
      operationId: v1_tickets_create
      description: Complete CRUD, search, filter, sorting, assignment, and messaging
        for tickets.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTicketCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupportTicketCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupportTicketCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketCreate'
          description: ''
  /api/v1/tickets/{id}/:
    get:
      operationId: v1_tickets_retrieve
      description: Complete CRUD, search, filter, sorting, assignment, and messaging
        for tickets.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketDetail'
          description: ''
    put:
      operationId: v1_tickets_update
      description: Complete CRUD, search, filter, sorting, assignment, and messaging
        for tickets.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTicketDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupportTicketDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupportTicketDetailRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketDetail'
          description: ''
    patch:
      operationId: v1_tickets_partial_update
      description: Complete CRUD, search, filter, sorting, assignment, and messaging
        for tickets.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSupportTicketDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSupportTicketDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSupportTicketDetailRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketDetail'
          description: ''
    delete:
      operationId: v1_tickets_destroy
      description: Complete CRUD, search, filter, sorting, assignment, and messaging
        for tickets.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/tickets/{id}/activity/:
    get:
      operationId: v1_tickets_activity_retrieve
      description: GET /tickets/{id}/activity/ -> list activity audit log
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketList'
          description: ''
  /api/v1/tickets/{id}/assign/:
    post:
      operationId: v1_tickets_assign_create
      description: |-
        Assign or reassign ticket to a support agent.
        Admins and Agents only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTicketListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupportTicketListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupportTicketListRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketList'
          description: ''
  /api/v1/tickets/{id}/messages/:
    get:
      operationId: v1_tickets_messages_retrieve
      description: |-
        GET /tickets/{id}/messages/ -> list messages (strips internal notes for customers)
        POST /tickets/{id}/messages/ -> add message or internal note
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketList'
          description: ''
    post:
      operationId: v1_tickets_messages_create
      description: |-
        GET /tickets/{id}/messages/ -> list messages (strips internal notes for customers)
        POST /tickets/{id}/messages/ -> add message or internal note
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTicketListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupportTicketListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupportTicketListRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketList'
          description: ''
  /api/v1/tickets/{id}/reopen/:
    post:
      operationId: v1_tickets_reopen_create
      description: Customer or staff can reopen an eligible resolved/closed ticket.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTicketListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupportTicketListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupportTicketListRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketList'
          description: ''
  /api/v1/users/:
    get:
      operationId: v1_users_list
      description: Admin-only management of system users (Admins, Agents, Customers).
      parameters:
      - in: query
        name: department
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADMIN
          - AGENT
          - CUSTOMER
        description: |-
          * `ADMIN` - Admin
          * `AGENT` - Support Agent
          * `CUSTOMER` - Customer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserManagementList'
          description: ''
    post:
      operationId: v1_users_create
      description: Admin-only management of system users (Admins, Agents, Customers).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserManagementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserManagementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserManagementRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserManagement'
          description: ''
  /api/v1/users/{id}/:
    get:
      operationId: v1_users_retrieve
      description: Admin-only management of system users (Admins, Agents, Customers).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserManagement'
          description: ''
    put:
      operationId: v1_users_update
      description: Admin-only management of system users (Admins, Agents, Customers).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserManagementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserManagementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserManagementRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserManagement'
          description: ''
    patch:
      operationId: v1_users_partial_update
      description: Admin-only management of system users (Admins, Agents, Customers).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserManagementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserManagementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserManagementRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserManagement'
          description: ''
    delete:
      operationId: v1_users_destroy
      description: Admin-only management of system users (Admins, Agents, Customers).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    AdminUserManagement:
      type: object
      description: Used exclusively by Admins to manage users, assign roles and departments.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        department:
          type: string
          nullable: true
          maxLength: 100
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - updated_at
    AdminUserManagementRequest:
      type: object
      description: Used exclusively by Admins to manage users, assign roles and departments.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        department:
          type: string
          nullable: true
          maxLength: 100
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
      required:
      - email
    CustomTokenObtainPairRequest:
      type: object
      description: Custom JWT serializer to include user details (role, email, name)
        in token payload.
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    PaginatedAdminUserManagementList:
      type: object
